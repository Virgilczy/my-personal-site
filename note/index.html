<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="robots" content="noindex, nofollow">
  <title>留给三石</title>
  <link rel="stylesheet" href="/note/style.css">
</head>
<body>
  <main class="note-card">
    <a class="back-link" href="/">← 回到首页</a>
    <h1>我那时怎么称呼你？<span>（四个字）</span></h1>
    <p class="description">想起来的话，请写下答案。</p>

    <form id="answer-form">
      <label for="answer">你的答案</label>
      <input id="answer" name="answer" type="text" autocomplete="off" required>
      <button type="submit">确认</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p id="contact" class="contact" hidden></p>
  </main>

  <script>
    const form = document.querySelector("#answer-form");
    const message = document.querySelector("#message");
    const contact = document.querySelector("#contact");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "正在确认……";
      contact.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch("/api/note", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answer: form.elements.answer.value })
        });
        const result = await response.json();

        if (response.ok && result.correct) {
          message.textContent = "真的是你吗？联系我吧：";
          contact.textContent = result.contact;
          contact.hidden = false;
          form.hidden = true;
        } else {
          message.textContent = result.message || "好像不太对，再想一想。";
        }
      } catch {
        message.textContent = "暂时无法确认，请稍后再试。";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
